# HLint configuration for collection-json.
# Reference: https://github.com/ndmitchell/hlint#readme

- arguments: [--color=auto]

- group: {name: future, enabled: true}
- group: {name: partial, enabled: true}
- group: {name: partial-strict, enabled: true}

# An incidental export forces a major PVP bump.
- warn: {name: Use explicit module export list}

# unsafePerformIO has no place in a pure data-modelling library.
#
# The partial groups above reach the list and Maybe eliminators but not
# the three below, which are what remains for putting a bottom in a
# total API. A decoder that cannot make sense of its input says so
# through the aeson parser's failure channel; readMaybe covers the rest.
- functions:
    - {name: unsafePerformIO, within: []}
    - {name: error, within: []}
    - {name: undefined, within: []}
    - {name: read, within: []}

# Hard-coded literal URIs in tests are safe to fromJust; the failure
# mode would surface on first run, not at a customer.
- ignore:
    name: Avoid partial function
    within: Data.CollectionJSONTest
