# git-cliff configuration: renders CHANGELOG.md from history.
# https://git-cliff.org/docs/configuration
#
# 1.3.1.3 and earlier predate the generator and live verbatim in the
# footer; skip_tags keeps their commits out.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog 1.1.0](https://keepachangelog.com/en/1.1.0/),
and this project adheres to the [Haskell Package Versioning Policy
(PVP)](https://pvp.haskell.org/).
"""
# The group prefix fixes Keep a Changelog's category order; striptags drops it.
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | trim | upper_first }}
{%- for footer in commit.footers | filter(attribute="token", value="Migration") %}

  Migration: {{ footer.value | trim | replace(from="\n", to="\n  ") }}
{%- endfor %}
{%- endfor %}
{% endfor %}
"""
