trim = false

[git]
conventional_commits = true
filter_commits = true
# Only what a consumer builds against earns an entry. A tag on a commit
# outside these paths is invisible, which the version bump in the cabal
# file avoids.
include_paths = ["src/**", "collection-json.cabal"]
tag_pattern = "^v?[0-9]"
skip_tags = "^[0-9]"
sort_commits = "oldest"
# A file in .cliff/overrides named for a commit's full SHA replaces that
# commit's message, curating commits from before the title convention. A
# `Migration:` trailer renders as a paragraph under the entry.
commit_preprocessors = [
  { pattern = '(?s).*', replace_command = 'f=".cliff/overrides/$COMMIT_SHA"; if [ -f "$f" ]; then cat "$f"; else cat; fi' },
]
commit_parsers = [
  { message = '^add(\(.*\))?!?:', group = "<!-- 0 -->Added" },
  { message = '^change(\(.*\))?!?:', group = "<!-- 1 -->Changed" },
  { message = '^deprecate(\(.*\))?!?:', group = "<!-- 2 -->Deprecated" },
  { message = '^remove(\(.*\))?!?:', group = "<!-- 3 -->Removed" },
  { message = '^fix(\(.*\))?!?:', group = "<!-- 4 -->Fixed" },
  { message = '^security(\(.*\))?!?:', group = "<!-- 5 -->Security" },
]
