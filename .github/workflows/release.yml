name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.3.1.4) — must already exist as a Hackage candidate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - name: Verify tag matches cabal version
        id: verify
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cabal_version="$(grep -i '^version:' collection-json.cabal | awk '{print $2}')"
          tag_version="${TAG#v}"
          tag_version="${tag_version%%-*}"
          if [ "$cabal_version" != "$tag_version" ]; then
            echo "::error::Tag $TAG resolves to version $tag_version but collection-json.cabal declares $cabal_version"
            exit 1
          fi
          echo "version=$cabal_version" >> "$GITHUB_OUTPUT"

  candidate:
    name: Upload Hackage candidate
    needs: version
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: hackage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: 'latest'
          cabal-version: 'latest'

      - run: cabal update

      - run: cabal sdist

      - run: cabal haddock --haddock-for-hackage

      - name: Upload sdist as candidate
        env:
          HACKAGE_KEY: ${{ secrets.HACKAGE_TOKEN }}
        run: cabal upload dist-newstyle/sdist/*.tar.gz

      - name: Upload documentation as candidate
        env:
          HACKAGE_KEY: ${{ secrets.HACKAGE_TOKEN }}
        run: cabal upload --documentation dist-newstyle/*-docs.tar.gz

  # The smoke test runs after the upload for early feedback and again
  # before publish, which runs as a separate dispatch where candidate is
  # skipped. Explicit result checks replace the implicit success(), which
  # would propagate that skip down the chain.
  candidate-ghc:
    name: Read candidate GHC range
    needs: [version, candidate]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.candidate.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    outputs:
      tarball: ${{ steps.range.outputs.tarball }}
      ghc-versions: ${{ steps.range.outputs.ghc-versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      # The ends of tested-with catch both lower- and upper-bound solve
      # failures without paying for the full CI matrix on every release.
      - name: Read tested-with ends from the candidate
        id: range
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          base="https://hackage.haskell.org/package/collection-json-$VERSION/candidate"
          ghc_versions=$(curl -fsSL "$base/collection-json.cabal" \
            | .github/scripts/tested-with-ghc.sh \
            | sed -n '1p;$p' | uniq \
            | jq -Rnc '[inputs]')
          echo "tarball=$base/collection-json-$VERSION.tar.gz" >> "$GITHUB_OUTPUT"
          echo "ghc-versions=$ghc_versions" >> "$GITHUB_OUTPUT"

  # Builds from the uploaded candidate in a workspace with no checkout, so
  # its published bounds solve against the current index exactly as a
  # downstream consumer's would.
  smoke-test:
    name: Smoke-test candidate on GHC ${{ matrix.ghc }}
    needs: candidate-ghc
    if: ${{ !cancelled() && needs.candidate-ghc.result == 'success' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ghc: ${{ fromJSON(needs.candidate-ghc.outputs.ghc-versions) }}
    steps:
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 'latest'

      - run: cabal update

      # cabal won't build test suites of a package listed as a remote
      # tarball in cabal.project, so unpack it and build it as local.
      - name: Download candidate
        env:
          TARBALL: ${{ needs.candidate-ghc.outputs.tarball }}
        run: |
          mkdir candidate
          curl -fsSL "$TARBALL" | tar xz -C candidate --strip-components=1

      # allow-newer mirrors ci.yml's network-arbitrary stopgap.
      - name: Build and test
        working-directory: candidate
        run: cabal test --enable-tests --test-show-details=direct --allow-newer=network-arbitrary:base,network-arbitrary:QuickCheck

  publish:
    name: Publish to Hackage
    needs: smoke-test
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.smoke-test.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: hackage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: 'latest'
          cabal-version: 'latest'

      - run: cabal update

      - run: cabal sdist

      - run: cabal haddock --haddock-for-hackage

      - name: Publish sdist
        env:
          HACKAGE_KEY: ${{ secrets.HACKAGE_TOKEN }}
        run: cabal upload --publish dist-newstyle/sdist/*.tar.gz

      - name: Publish documentation
        env:
          HACKAGE_KEY: ${{ secrets.HACKAGE_TOKEN }}
        run: cabal upload --publish --documentation dist-newstyle/*-docs.tar.gz
