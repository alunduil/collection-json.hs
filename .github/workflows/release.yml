name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.3.1.4) — must already exist as a Hackage candidate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Upload Hackage candidate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: hackage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag matches cabal version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cabal_version="$(grep -i '^version:' collection-json.cabal | awk '{print $2}')"
          tag_version="${TAG#v}"
          tag_version="${tag_version%%-*}"
          if [ "$cabal_version" != "$tag_version" ]; then
            echo "::error::Tag $TAG resolves to version $tag_version but collection-json.cabal declares $cabal_version"
            exit 1
          fi

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: 'latest'
          cabal-version: 'latest'

      - run: cabal update

      - run: cabal sdist

      - run: cabal haddock --haddock-for-hackage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hackage-candidate
          path: |
            dist-newstyle/sdist/*.tar.gz
            dist-newstyle/*-docs.tar.gz
          if-no-files-found: error

      - name: Upload sdist as candidate
        env:
          HACKAGE_KEY: ${{ secrets.HACKAGE_TOKEN }}
        run: cabal upload dist-newstyle/sdist/*.tar.gz

      - name: Upload documentation as candidate
        env:
          HACKAGE_KEY: ${{ secrets.HACKAGE_TOKEN }}
        run: cabal upload --documentation dist-newstyle/*-docs.tar.gz

  publish:
    name: Publish to Hackage
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: hackage
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - name: Verify tag matches cabal version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cabal_version="$(grep -i '^version:' collection-json.cabal | awk '{print $2}')"
          tag_version="${TAG#v}"
          tag_version="${tag_version%%-*}"
          if [ "$cabal_version" != "$tag_version" ]; then
            echo "::error::Tag $TAG resolves to version $tag_version but collection-json.cabal declares $cabal_version"
            exit 1
          fi

      # Publishing the candidate's own tarballs, rather than rebuilding, keeps
      # the irreversible Hackage upload byte-identical to what was reviewed.
      - name: Find candidate run
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=push&branch=$TAG&status=success" --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::No successful candidate run found for $TAG"
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hackage-candidate
          path: dist-newstyle
          run-id: ${{ steps.candidate.outputs.run-id }}
          github-token: ${{ github.token }}

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: 'latest'
          cabal-version: 'latest'

      - name: Publish sdist
        env:
          HACKAGE_KEY: ${{ secrets.HACKAGE_TOKEN }}
        run: cabal upload --publish dist-newstyle/sdist/*.tar.gz

      - name: Publish documentation
        env:
          HACKAGE_KEY: ${{ secrets.HACKAGE_TOKEN }}
        run: cabal upload --publish --documentation dist-newstyle/*-docs.tar.gz
