name: Weekly

# These sensors watch state that changes without a commit. Nobody is waiting
# on a scheduled run, so each reports through a tracking issue instead of
# failing, refreshing the standing one rather than filing a new one weekly.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 5"
      timezone: "Europe/London"
  # Pull requests run the checks so changes here are tested before merge.
  # No paths filter: a required check must report on every pull request.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull request runs group apart so they never queue behind the scheduled run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  drift:
    name: Check GHC matrix drift
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      drift: ${{ steps.check.outputs.drift }}
      expected: ${{ steps.check.outputs.expected }}
      tested: ${{ steps.check.outputs.tested }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read tested GHC versions
        id: tested-with
        uses: ./.github/actions/tested-ghc
        with:
          versions-only: true

      # Policy (#141): test every GHC major series upstream hasn't end-of-
      # lifed (endoflife.date `eol: false`), so the matrix spans the full
      # still-alive range rather than a hardcoded count.
      - name: Detect drift
        id: check
        env:
          TESTED_VERSIONS: ${{ steps.tested-with.outputs.matrix }}
        run: |
          set -euo pipefail

          expected=$(curl -fsSL https://endoflife.date/api/ghc.json \
            | jq -r 'map(select(.eol == false)) | .[].cycle' \
            | sort -V)

          # Guard against an upstream schema change or empty response: an
          # empty set would spuriously flag every series as drift.
          if [ -z "$expected" ]; then
            echo "endoflife.date returned no live GHC series; aborting" >&2
            exit 1
          fi

          tested=$(jq -r '.[] | split(".")[:2] | join(".")' \
            <<< "$TESTED_VERSIONS" | sort -uV)

          drift=false
          [ "$expected" = "$tested" ] || drift=true
          echo "drift=$drift" >> "$GITHUB_OUTPUT"

          join() { printf '%s' "$1" | paste -sd, -; }
          {
            echo "expected=$(join "$expected")"
            echo "tested=$(join "$tested")"
          } >> "$GITHUB_OUTPUT"

  # Filing jobs are separate so the checks, which pull requests run, never hold
  # issues: write.
  file-drift-issue:
    name: File GHC matrix drift issue
    needs: drift
    if: >-
      needs.drift.outputs.drift == 'true'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      issues: write

    steps:
      # create-an-issue reads the title and labels from front matter.
      - name: Write drift issue
        env:
          EXPECTED: ${{ needs.drift.outputs.expected }}
          TESTED: ${{ needs.drift.outputs.tested }}
        run: |
          {
            echo "---"
            echo "title: GHC version matrix out of date"
            echo "labels:"
            echo "  - infrastructure"
            echo "---"
            echo "\`tested-with\` should list every GHC major series that"
            echo "upstream still supports (policy: #141)."
            echo
            echo "| Source | Series |"
            echo "| --- | --- |"
            echo "| Expected (endoflife.date, not end-of-life) | $EXPECTED |"
            echo "| \`tested-with\` (\`collection-json.cabal\`) | $TESTED |"
            echo
            echo "Update \`tested-with\`, then bump per PVP"
            echo "(CI/packaging-only is a patch)."
          } > ghc-drift-issue.md

      # update_existing overwrites the open tracking issue with the same
      # title rather than filing a duplicate, and files a fresh one only
      # when none is open.
      - name: File or refresh drift issue
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          filename: ghc-drift-issue.md
          update_existing: true

  links:
    name: Check links
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      report: ${{ steps.report.outputs.report }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Set up lychee
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: lychee

      # Only a pull request fails on a dead link; other runs go on to file an
      # issue. The token lifts GitHub's anonymous rate limit on github.com
      # links.
      - name: Check links
        id: lychee
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          lychee --config lychee.toml --no-progress --mode task --format markdown './**/*.md' \
            | tee lychee.md "$GITHUB_STEP_SUMMARY"

      - name: Export broken-links report
        id: report
        if: steps.lychee.outcome == 'failure'
        run: |
          delimiter=$(openssl rand -hex 16)
          {
            echo "report<<$delimiter"
            cat lychee.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  file-links-issue:
    name: File broken-links issue
    needs: links
    if: >-
      needs.links.outputs.report != ''
      && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      issues: write

    steps:
      - name: Write broken-links issue
        env:
          REPORT: ${{ needs.links.outputs.report }}
        run: |
          {
            echo "---"
            echo "title: Broken links detected"
            echo "labels:"
            echo "  - documentation"
            echo "---"
            printf '%s\n' "$REPORT"
          } > broken-links-issue.md

      - name: File or refresh broken-links issue
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          filename: broken-links-issue.md
          update_existing: true
