name: Links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Fridays 18:00 Europe/London. GitHub applies the timezone (and DST), so the
    # report is waiting at 18:00 local year-round.
    - cron: "0 18 * * 5"
      timezone: "Europe/London"

permissions:
  contents: read
  # The scheduled run files an issue when it finds dead links; PR and push
  # runs fail loudly instead and don't use this.
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Set up lychee
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: lychee

      # A dead link blocks the merge. The scheduled run carries on so the next
      # step can file a tracking issue. The token lifts GitHub's anonymous rate
      # limit on github.com links.
      - name: Check links
        id: lychee
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Explicit bash enables pipefail; without it tee masks lychee's exit.
        shell: bash
        run: |
          mkdir -p lychee
          lychee --config lychee.toml --no-progress --mode task --format markdown './**/*.md' \
            | tee lychee/out.md "$GITHUB_STEP_SUMMARY"

      # Refresh the open tracking issue rather than filing a duplicate;
      # create-issue-from-file can't update, so drive gh directly.
      - name: File or refresh broken-links issue
        if: github.event_name == 'schedule' && steps.lychee.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Broken links detected
        run: |
          number=$(gh issue list --state open --label documentation \
            --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file lychee/out.md
            echo "Refreshed existing issue #$number"
          else
            gh issue create --title "$TITLE" --label documentation \
              --body-file lychee/out.md
          fi
