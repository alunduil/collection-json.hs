name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: GHC ${{ matrix.ghc }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-${{ matrix.OS_VERSION }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
        ghc: ["9.6", "9.8", "9.10", "9.12", "9.14"]
        include:
          - os: ubuntu
            # renovate: datasource=github-runners depName=ubuntu
            OS_VERSION: "26.04"
          - os: macos
            # renovate: datasource=github-runners depName=macos
            OS_VERSION: "26"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GHC ${{ matrix.ghc }}
        id: setup
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest

      - name: Update Hackage index
        run: cabal update

      # Everything below builds from the sdist tarball, not the working
      # tree: it exercises the bare published bounds a Hackage consumer
      # faces and validates that every source and test file is packaged.
      #
      # The lone exception: the test-only network-arbitrary still caps
      # base < 4.21 (no GHC 9.12+) and lags QuickCheck, so its bounds on
      # those two are relaxed via allow-newer below, pending a release
      # (alunduil/network-arbitrary#106). Scoped to that one package, so
      # the library's own published bounds stay strictly enforced; grep
      # allow-newer to remove the stopgap once the release ships.
      - name: Build sdist
        run: cabal sdist all

      - name: Unpack sdist
        shell: bash
        run: |
          mkdir sdist-build
          tar xf dist-newstyle/sdist/collection-json-*.tar.gz \
            -C sdist-build --strip-components=1

      - name: Generate build plan
        working-directory: sdist-build
        run: cabal build all --enable-tests --dry-run --allow-newer=network-arbitrary:base,network-arbitrary:QuickCheck

      - name: Restore cabal store
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('sdist-build/dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Install dependencies
        working-directory: sdist-build
        run: cabal build all --enable-tests --only-dependencies --allow-newer=network-arbitrary:base,network-arbitrary:QuickCheck

      - name: Save cabal store
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        working-directory: sdist-build
        run: cabal build all --enable-tests --allow-newer=network-arbitrary:base,network-arbitrary:QuickCheck

      - name: Test
        working-directory: sdist-build
        run: cabal test all --enable-tests --test-show-details=direct --allow-newer=network-arbitrary:base,network-arbitrary:QuickCheck

      - name: Check package metadata
        working-directory: sdist-build
        run: cabal check

      - name: Haddock
        working-directory: sdist-build
        run: cabal haddock all --allow-newer=network-arbitrary:base,network-arbitrary:QuickCheck

  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up GHC
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: "9.14"
          cabal-version: latest

      - name: Update Hackage index
        run: cabal update

      # Coverage builds from the working tree, not the sdist the build
      # job uses: the instrumented .mix/.tix paths then map straight onto
      # the repo's src/ layout that Codecov reports against. allow-newer
      # mirrors the build job's network-arbitrary stopgap.
      - name: Configure with coverage
        run: cabal configure --enable-tests --enable-coverage --allow-newer=network-arbitrary:base,network-arbitrary:QuickCheck

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test all --test-show-details=direct

      # excludes drops the test components so the report measures the
      # library module alone.
      - name: Generate coverage report
        id: report
        uses: 8c6794b6/hpc-codecov-action@f943f40733e5390825b12d72165cad991e44340c # v4.3.0
        with:
          target: cabal:collection-json-tests
          excludes: Main,Paths_collection_json,Data.CollectionJSONTest,Data.CollectionJSON.Arbitrary

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.report.outputs.report }}
          fail_ci_if_error: true

  # vale exits zero on warnings, so reviewdog gates them; the pre-commit hook
  # gates errors tree-wide. reviewdog needs a PR diff, so only its step is
  # guarded: on push the job succeeds empty and `results` can still require it.
  prose:
    name: Check prose
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write

    env:
      # Match the vale hook's rev in .pre-commit-config.yaml.
      # renovate: datasource=github-releases depName=errata-ai/vale extractVersion=^v(?<version>.+)$
      VALE_VERSION: "3.21.0"
      # renovate: datasource=github-releases depName=reviewdog/reviewdog
      REVIEWDOG_VERSION: "v0.21.2"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Vale
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar xz -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: ${{ env.REVIEWDOG_VERSION }}

      - name: Check prose on changed lines
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Explicit bash enables pipefail; without it a vale crash passes.
        shell: bash
        run: |
          vale --no-exit --output=JSON . \
            | jq -c '
              to_entries[] | .key as $p | .value[] | {
                message: .Message,
                location: {
                  path: $p,
                  range: {
                    start: {line: .Line, column: .Span[0]},
                    end: {line: .Line, column: (.Span[1] + 1)},
                  },
                },
                severity: ({error: "ERROR", warning: "WARNING", suggestion: "INFO"}[.Severity]),
                code: {value: .Check},
              }' \
            | reviewdog -f=rdjsonl -name=vale \
                -reporter=github-pr-check -filter-mode=added -fail-level=warning

  # The stable check name the default-branch ruleset pins: renaming this job
  # breaks the merge gate. Requiring the matrix legs directly would block
  # merges once a GHC version ages out and its check stops reporting.
  results:
    name: Check CI results
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [build, coverage, prose]
    if: always()

    steps:
      - name: Fail when any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
