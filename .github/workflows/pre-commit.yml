name: Pre-commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Both tools version with PVP, whose four-component releases the default
  # semver-coerced versioning reports as unstable — `ignoreUnstable` then hides
  # every update. `loose` compares them component-wise instead.
  # renovate: datasource=github-releases depName=fourmolu/fourmolu versioning=loose extractVersion=^v(?<version>.+)$
  FOURMOLU_VERSION: "0.20.0.0"
  # renovate: datasource=github-releases depName=ndmitchell/hlint versioning=loose extractVersion=^v(?<version>.+)$
  HLINT_VERSION: "3.10"

jobs:
  hooks:
    name: Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Fourmolu
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/fourmolu.zip \
            "https://github.com/fourmolu/fourmolu/releases/download/v${FOURMOLU_VERSION}/fourmolu-${FOURMOLU_VERSION}-linux-x86_64.zip"
          unzip -j /tmp/fourmolu.zip '*/fourmolu' -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/fourmolu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up HLint
        uses: haskell-actions/hlint-setup@fe9cd1cd1af94a23900c06738e73f6ddb092966a # v2
        with:
          version: ${{ env.HLINT_VERSION }}

      # pre-commit/action pulls in `actions/cache@v4` by tag, which this repo's
      # SHA-pin policy rejects for nested references. This action pins its own
      # dependencies and provisions Python through uv.
      - name: Run pre-commit
        uses: tox-dev/action-pre-commit-uv@e09b8958484dfe71f4ac3bc7afb230ba506402ec # v1.0.5
