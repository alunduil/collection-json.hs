name: GHC matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 5"
      timezone: "Europe/London"
  # Pull requests run drift detection so changes here are tested before merge.
  # No paths filter: a required check must report on every pull request.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull request runs group apart so they never queue behind the scheduled run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  drift:
    name: Check GHC matrix drift
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      drift: ${{ steps.check.outputs.drift }}
      expected: ${{ steps.check.outputs.expected }}
      matrix: ${{ steps.check.outputs.matrix }}
      tested: ${{ steps.check.outputs.tested }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Policy (#141): test every GHC major series upstream hasn't end-of-
      # lifed (endoflife.date `eol: false`), so the matrix spans the full
      # still-alive range rather than a hardcoded count.
      - name: Detect drift
        id: check
        run: |
          set -euo pipefail

          expected=$(curl -fsSL https://endoflife.date/api/ghc.json \
            | jq -r 'map(select(.eol == false)) | .[].cycle' \
            | sort -V)

          # Guard against an upstream schema change or empty response: an
          # empty set would spuriously flag every series as drift.
          if [ -z "$expected" ]; then
            echo "endoflife.date returned no live GHC series; aborting" >&2
            exit 1
          fi

          matrix=$(yq '.jobs.build.strategy.matrix.ghc[]' \
            .github/workflows/ci.yml | sort -V)

          tested=$(.github/scripts/tested-with-ghc.sh < collection-json.cabal)

          # An empty matrix means a parse failure or a moved field; abort
          # rather than file a spurious drift issue.
          if [ -z "$matrix" ]; then
            echo "could not parse the CI matrix; aborting" >&2
            exit 1
          fi

          drift=false
          [ "$expected" = "$matrix" ] || drift=true
          [ "$expected" = "$tested" ] || drift=true
          echo "drift=$drift" >> "$GITHUB_OUTPUT"

          join() { printf '%s' "$1" | paste -sd, -; }
          {
            echo "expected=$(join "$expected")"
            echo "matrix=$(join "$matrix")"
            echo "tested=$(join "$tested")"
          } >> "$GITHUB_OUTPUT"

  # A separate job keeps issues: write out of the detection pull requests run.
  file-drift-issue:
    name: File GHC matrix drift issue
    needs: drift
    if: >-
      needs.drift.outputs.drift == 'true'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      issues: write

    steps:
      # create-an-issue reads the title and labels from front matter.
      - name: Write drift issue
        env:
          EXPECTED: ${{ needs.drift.outputs.expected }}
          MATRIX: ${{ needs.drift.outputs.matrix }}
          TESTED: ${{ needs.drift.outputs.tested }}
        run: |
          {
            echo "---"
            echo "title: GHC version matrix out of date"
            echo "labels:"
            echo "  - infrastructure"
            echo "---"
            echo "The CI matrix and \`tested-with\` should track every GHC major"
            echo "series upstream hasn't end-of-lifed (policy: #141)."
            echo
            echo "| Source | Series |"
            echo "| --- | --- |"
            echo "| Expected (endoflife.date, not end-of-life) | $EXPECTED |"
            echo "| CI matrix (\`.github/workflows/ci.yml\`) | $MATRIX |"
            echo "| \`tested-with\` (\`collection-json.cabal\`) | $TESTED |"
            echo
            echo "Update the matrix and \`tested-with\`, then bump per PVP"
            echo "(CI/packaging-only is a patch)."
          } > ghc-drift-issue.md

      # update_existing overwrites the open tracking issue with the same
      # title rather than filing a duplicate, and files a fresh one only
      # when none is open.
      - name: File or refresh drift issue
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          filename: ghc-drift-issue.md
          update_existing: true
